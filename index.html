<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pro Pocket Beauty 集客分析</title>
<link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
<header><div><small>PRO POCKET BEAUTY</small><h1>集客分析ダッシュボード</h1></div><button id="reload">更新</button></header>
<main>
<section class="toolbar"><label>期間<select id="period"><option value="all">全期間</option><option value="7">過去7日</option><option value="30" selected>過去30日</option><option value="90">過去90日</option></select></label><p id="status">読み込み中…</p></section>
<section class="metrics">
<div><span>PV</span><b id="pv">0</b></div><div><span>訪問者数</span><b id="users">0</b></div><div><span>セッション数</span><b id="sessions">0</b></div><div><span>新規訪問</span><b id="newUsers">0</b></div>
</section>
<section class="columns"><article><h2>人気ページ</h2><div id="pages"></div></article><article><h2>流入元</h2><div id="sources"></div></article><article><h2>デバイス</h2><div id="devices"></div></article></section>
<section><h2>アクセス明細</h2><div class="table-wrap"><table><thead><tr><th>日時</th><th>ページ</th><th>流入元</th><th>端末</th></tr></thead><tbody id="details"></tbody></table></div></section>
</main>
<script src="./js/config.js"></script><script src="./js/dashboard.js"></script>
</body></html>
